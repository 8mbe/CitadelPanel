# CitadelPanel control plane and one local Docker node.
#
# Next.js is the only public web service and owns auth, users, setup, PostgreSQL
# metadata, and all browser-facing APIs. The Bun backend is a node-only service:
# it owns Docker and server files and is reachable only from Next.js.
#
# Generate secrets on the HOST first, because compose interpolates them before
# any container exists:
#
#   bun run env:init        # writes .env (or copy .env.example and fill it in)
#   docker compose up -d --build
#
# Schema migrations run inside the frontend container on every boot, and the
# admin account is claimed in the browser at /setup. See docs/docker.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citadel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-citadel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      # Aliased, not bare. A platform that renames services (Dokploy's
      # "Randomize", which rewrites every service to <name>-<suffix>) takes the
      # hostname `postgres` with it, and DATABASE_URL below still asks for
      # `postgres`. Aliases are the one thing those transforms copy through
      # untouched, so naming the host here is what keeps the URL true.
      panel_net:
        aliases:
          - postgres
    healthcheck:
      # -d is not optional: pg_isready defaults the database name to the user
      # name, so whenever POSTGRES_DB differs from POSTGRES_USER every probe
      # logs a FATAL "database does not exist". The server is up either way, so
      # the check still passed and the only symptom was the log filling up.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citadel} -d ${POSTGRES_DB:-citadel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      # Repo root: the workspace lockfile is what pins the install.
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-citadel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-citadel}
      PANEL_ENCRYPTION_KEY: ${PANEL_ENCRYPTION_KEY:?PANEL_ENCRYPTION_KEY is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FIRST_USER_BECOMES_ADMIN: ${FIRST_USER_BECOMES_ADMIN:-true}
      NODE_API_TIMEOUT_MS: ${NODE_API_TIMEOUT_MS:-15000}
      WATCHER_INTERVAL_SECONDS: ${WATCHER_INTERVAL_SECONDS:-60}
      SUSPICION_FLAG_THRESHOLD: ${SUSPICION_FLAG_THRESHOLD:-60}
      SUSPICION_AUTO_SUSPEND: ${SUSPICION_AUTO_SUSPEND:-false}
      SUSPICION_AUTO_SUSPEND_THRESHOLD: ${SUSPICION_AUTO_SUSPEND_THRESHOLD:-115}
    ports:
      # Published host port is a variable because 3000 is not always free: a
      # PaaS may already be sitting on it (Dokploy serves its own dashboard
      # there, and its installer requires 3000 free), and the failure is a
      # daemon-level "port is already allocated" that aborts the deploy. The
      # container's listener is fixed at 3000; move the host side instead, or
      # drop this mapping entirely and route to the service through the
      # platform's proxy. See docs/docker.md.
      - "${PANEL_PORT:-3000}:3000"
    networks:
      panel_net:
        aliases:
          - frontend
      # The agent resolves this one: PANEL_URL is how it calls back to validate
      # console tokens and write audit entries, and it does that from node_net.
      node_net:
        aliases:
          - frontend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN is required}
      AGENT_PORT: 8081
      SERVER_DATA_ROOT: /var/lib/citadel/servers
      # Base URL of the panel, for the direct-console WebSocket's validate +
      # audit callbacks (agent → panel). Required for the browser-direct console.
      PANEL_URL: ${PANEL_URL:-http://frontend:3000}
      # Optional TLS for the agent's HTTP/WS server. Required for the browser-
      # direct console when the panel is served over HTTPS (browsers block ws://
      # from an https:// page as mixed content). Mount certs and set both paths.
      AGENT_TLS_CERT: ${AGENT_TLS_CERT:-}
      AGENT_TLS_KEY: ${AGENT_TLS_KEY:-}
      # SFTP server (custom ssh2, own listener in the same process). 0 disables.
      # Fixed inside the container; remap the published port below if 8022 is
      # taken on the host.
      SFTP_PORT: 8022
    ports:
      # Published so browsers can open the direct console WebSocket. In a homelab
      # this is fine on localhost/LAN; in production put it behind a TLS-
      # terminating reverse proxy (Caddy/Nginx) rather than exposing 8081 bare.
      # Variable for the same reason as the panel port above; the agent's
      # listener stays 8081 inside the container.
      - "${AGENT_PUBLIC_PORT:-8081}:8081"
      # SFTP. Reachable by the operator's SFTP clients, so keep it on a trusted
      # interface. Auth is delegated to the panel, but the transport has no TLS
      # proxy in front of it here.
      - "${SFTP_PORT:-8022}:8022"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The whole /var/lib/citadel tree, not just servers/: the agent also puts
      # the SFTP host key and the backup staging directory alongside the data
      # root, and both have to be real host paths. The host key so client
      # fingerprints survive a restart, the staging directory because restic
      # runs in a sibling container that bind-mounts it from the host.
      # Identical on both sides on purpose: the path the agent reports is the
      # path the daemon mounts into game containers.
      - /var/lib/citadel:/var/lib/citadel
      # Uncomment to provide TLS material for the agent's wss:// server.
      # - ./certs:/certs:ro
    networks:
      node_net:
        aliases:
          # `agent` is the name the panel is pointed at; `backend` is the
          # service name, which an operator may well have typed into the node's
          # API URL at registration. Both are free, and a node address stored in
          # the database is not something a redeploy gets to invalidate.
          - agent
          - backend
    healthcheck:
      test: ["CMD", "bun", "--eval", "await fetch('http://localhost:8081/v1/health', { headers: { authorization: 'Bearer ' + process.env.NODE_TOKEN } }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  panel_net:
    driver: bridge
  node_net:
    driver: bridge

volumes:
  postgres_data:
